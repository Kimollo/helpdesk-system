spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: helpdesk
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/helpdesk}
    username: ${SPRING_DATASOURCE_USERNAME:helpdesk}
    password: ${SPRING_DATASOURCE_PASSWORD:helpdesk}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 32
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8081}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 8h
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
    allowed-origin-patterns:
      - https://*.vercel.app
  seed:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
